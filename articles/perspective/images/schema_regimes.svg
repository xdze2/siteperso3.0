<text x="20.0" y="262.0" fill="#000" text-anchor="start" font-size="12">far: rays to the box almost parallel = parallel projection along the line of sight.</text>
<text x="20.0" y="278.0" fill="#000" text-anchor="start" font-size="12">close: they fan out, the eye sees the top face more and more edge-on.</text>
<text x="20.0" y="320.0" fill="#000" text-anchor="start" font-size="13">B. r = top face / front face, as seen, against a/d (box size / distance).</text>
<text x="20.0" y="337.0" fill="#888" text-anchor="start" font-size="12">above: what the eye sees, scaled to the same front face.</text>
